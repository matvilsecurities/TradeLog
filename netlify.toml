[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback. Function URLs (/.netlify/functions/*) are handled before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
